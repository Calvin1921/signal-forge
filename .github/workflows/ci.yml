name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # after Build: next build generates the gitignored next-env.d.ts
      # that tsc needs for Next's ambient types
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  # Advisory-only: surfaces transitive advisories without blocking the build.
  # Actual dependency bumps are handled via Dependabot PRs.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # continue-on-error at STEP level: advisories annotate the run without
      # failing the job's check (job-level continue-on-error still reports a
      # failed check-run and reds the commit rollup)
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
